<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실거래 알리미</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#efece4;
      --surface:#fbfaf6;
      --ink:#1c2233;
      --ink-soft:#666c78;
      --line:#dcd8cd;
      --navy:#28324a;
      --navy-deep:#1a2135;
      --stamp:#a8382c;
      --kakao:#fee500;
    }

    *{box-sizing:border-box}

    body{
      font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
      max-width:720px;
      margin:0 auto;
      padding:0 0 72px;
      background:var(--paper);
      color:var(--ink);
      line-height:1.55
    }

    header{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      padding:28px 22px 18px;
      border-bottom:1px solid var(--line)
    }

    header h1{
      margin:0;
      font-family:'Noto Serif KR',serif;
      font-weight:700;
      font-size:22px;
      letter-spacing:-.2px;
      color:var(--navy-deep)
    }

    #status{
      font-size:12.5px;
      color:var(--ink-soft);
      font-variant-numeric:tabular-nums
    }

    main{padding:0 22px}

    #guest{
      text-align:center;
      padding:56px 20px
    }

    #guest p{
      margin:0 0 24px;
      color:var(--ink-soft);
      font-size:14.5px
    }

    #login{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      background:var(--kakao);
      color:#191919;
      padding:13px 26px;
      border-radius:8px;
      font-weight:700;
      font-size:14.5px
    }

    section{margin-top:38px}

    section > h2{
      margin:0 0 4px;
      font-family:'Noto Serif KR',serif;
      font-weight:700;
      font-size:17px;
      color:var(--navy-deep)
    }

    section > p.hint{
      margin:0 0 16px;
      font-size:12.5px;
      color:var(--ink-soft)
    }

    .entry{
      display:flex;
      align-items:center;
      gap:14px;
      padding:15px 4px 15px 14px;
      border-bottom:1px solid var(--line);
      position:relative
    }

    .entry:before{
      content:"";
      position:absolute;
      left:0; top:10px; bottom:10px;
      width:3px;
      background:var(--navy);
      border-radius:2px
    }

    .entry:first-child{border-top:1px solid var(--line)}

    .entry .info{flex:1; min-width:0}

    .entry b{
      display:block;
      font-size:15.5px;
      font-weight:700;
      color:var(--ink)
    }

    .entry .district{
      margin-top:2px;
      font-size:12.5px;
      color:var(--ink-soft);
      font-variant-numeric:tabular-nums
    }

    #empty{
      padding:30px 4px;
      text-align:center;
      font-size:13.5px;
      color:var(--ink-soft);
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line)
    }

    .search-row{
      display:grid;
      grid-template-columns:150px 150px 1fr auto;
      gap:8px
    }

    input,select{
      font:inherit;
      font-size:14px;
      padding:12px 13px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--ink);
      border-radius:7px;
      outline:none;
      transition:border-color .15s ease
    }

    input:focus,select:focus{border-color:var(--navy)}

    input::placeholder{color:#a7a49a}

    button{
      font:inherit;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      border:0;
      border-radius:7px;
      padding:12px 20px;
      background:var(--navy);
      color:#fff;
      transition:opacity .12s ease,transform .1s ease
    }

    button:hover{opacity:.9}
    button:active{transform:scale(.98)}
    button:disabled{cursor:default}

    #searchStatus{
      margin-top:14px;
      font-size:12.5px;
      color:var(--ink-soft)
    }

    #results .entry{padding-right:0}

    .btn-danger{
      background:transparent;
      color:var(--stamp);
      border:1px solid #e6c8c3;
      padding:8px 14px;
      font-size:12.5px
    }

    .btn-danger:hover{background:#fbf0ee}

    .btn-add{
      background:var(--navy);
      color:#fff;
      padding:8px 16px;
      font-size:12.5px;
      white-space:nowrap
    }

    /* 등록완료: 관공서 서류의 도장(인감)을 본뜬 배지 */
    .stamp{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:64px;
      height:64px;
      border-radius:50%;
      border:2px solid var(--stamp);
      color:var(--stamp);
      font-family:'Noto Serif KR',serif;
      font-weight:700;
      font-size:12.5px;
      letter-spacing:-.3px;
      transform:rotate(-9deg);
      background:transparent;
      flex-shrink:0;
      opacity:.85;
      white-space:normal;
      line-height:1.15;
      text-align:center;
      padding:0 4px
    }

    .footer-row{
      margin-top:44px;
      padding-top:18px;
      border-top:1px solid var(--line);
      text-align:right
    }

    .btn-ghost{
      background:transparent;
      color:var(--ink-soft);
      border:1px solid var(--line);
      font-weight:500;
      font-size:12.5px;
      padding:9px 16px
    }

    .btn-ghost:hover{background:var(--surface)}

    .hidden{display:none}

    @media(max-width:520px){
      header{padding:22px 16px 16px}
      main{padding:0 16px}
      .search-row{grid-template-columns:1fr}
      .stamp{width:56px;height:56px;font-size:11.5px}
    }
  </style>
</head>
<body>
  <header>
    <h1>실거래 알리미</h1>
    <div id="status">로그인 여부를 확인하고 있어요…</div>
  </header>

  <main>
    <div id="guest" class="hidden">
      <p>카카오로 로그인하면 내가 원하는 아파트만 골라서<br>실거래 알림을 받을 수 있어요.</p>
      <a id="login" href="/api/login">카카오로 로그인</a>
    </div>

    <div id="app" class="hidden">
      <section>
        <h2>내 관심 아파트</h2>
        <div id="mine"></div>
        <div id="empty" class="hidden">아직 등록한 아파트가 없어요.</div>
      </section>

      <section>
        <h2>아파트 추가</h2>
        <p class="hint">전국 시·군·구를 지원해요. 지역을 고르고 아파트 이름을 검색하세요. (최근 6개월 내 실거래가가 있는 단지만 검색돼요)</p>
        <div class="search-row">
          <select id="sidoSelect" onchange="fillDistrictSelect()"></select>
          <select id="districtSelect"></select>
          <input id="search" placeholder="예: 헬리오시티, 잠실주공" onkeydown="if(event.key==='Enter') searchApartments()">
          <button onclick="searchApartments()">검색</button>
        </div>
        <div id="results"></div>
        <div id="searchStatus"></div>
      </section>

      <section>
        <h2>카카오 알림 테스트</h2>
        <p class="hint">실거래 검사와 관계없이 지금 로그인한 본인에게 테스트 카카오톡을 한 통 보내요.</p>
        <button id="testNotifyBtn" onclick="testNotify()">🔔 테스트 알림 보내기</button>
        <div id="testNotifyStatus"></div>
      </section>

      <div class="footer-row">
        <button class="btn-ghost" onclick="logout()">로그아웃</button>
      </div>
    </div>
  </main>

<script>
let me = null;
let subscriptions = [];
let apartments = [];
let lastResults = [];

// 서버와 동일한 전국 지역 목록. 검색 시 서버가 최종적으로 코드 유효성을 다시 확인합니다.
let regionList = [];

async function api(url, options={}) {
  const r = await fetch(url, {credentials:'include', ...options});
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || '요청에 실패했습니다.');
  return data;
}

async function loadRegions(){
  const data = await api('/api/regions');
  regionList = data.regions || [];
  const sidoSel = document.getElementById('sidoSelect');
  const sidos = [...new Set(regionList.map(r=>r.sido))];
  sidoSel.innerHTML = sidos.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  fillDistrictSelect();
}

function fillDistrictSelect(){
  const sido=document.getElementById('sidoSelect').value;
  const sel=document.getElementById('districtSelect');
  const districts=regionList.filter(r=>r.sido===sido);
  sel.innerHTML = districts.map(d=>`<option value="${escapeHtml(d.name)}">${escapeHtml(d.name.replace(d.sido+' ','').replace(d.sido,''))}</option>`).join('');
}

async function init(){
  try{
    await loadRegions();
    const data = await api('/api/me');
    if(!data.loggedIn){
      document.getElementById('status').textContent='로그인하지 않았어요.';
      document.getElementById('guest').classList.remove('hidden');
      return;
    }
    me=data.user;
    document.getElementById('status').textContent=`${me.nickname || '사용자'}님으로 로그인됨`;
    document.getElementById('app').classList.remove('hidden');
    await loadAll();
  }catch(e){
    document.getElementById('status').textContent=e.message;
    document.getElementById('guest').classList.remove('hidden');
  }
}

async function loadAll(){
  const [a,s]=await Promise.all([api('/api/apartments'),api('/api/subscriptions')]);
  apartments=a.apartments; subscriptions=s.subscriptions;
  renderMine();
}

function renderMine(){
  const box=document.getElementById('mine');
  const empty=document.getElementById('empty');
  box.innerHTML='';
  const list=subscriptions.map(id=>apartments.find(a=>a.id===id)).filter(Boolean);
  empty.classList.toggle('hidden', list.length!==0);
  list.forEach(a=>{
    const div=document.createElement('div'); div.className='entry';
    div.innerHTML=`<div class="info"><b>${escapeHtml(a.name)}</b><div class="district">${escapeHtml(a.district)}</div></div>`;
    const btn=document.createElement('button'); btn.className='btn-danger'; btn.textContent='삭제';
    btn.onclick=()=>removeApartment(a.id); div.appendChild(btn); box.appendChild(div);
  });
}

async function searchApartments(){
  const district=document.getElementById('districtSelect').value;
  const q=document.getElementById('search').value.trim();
  const box=document.getElementById('results');
  const status=document.getElementById('searchStatus');
  if(!q){ box.innerHTML=''; status.textContent='아파트 이름을 입력해주세요.'; return; }
  status.textContent='검색 중…';
  box.innerHTML='';
  try{
    const data=await api(`/api/search-apartments?district=${encodeURIComponent(district)}&q=${encodeURIComponent(q)}`);
    lastResults=data.results||[];
    status.textContent = lastResults.length ? '' : '최근 6개월 내 거래 기록에서 일치하는 단지를 찾지 못했어요.';
    lastResults.forEach(a=>{
      const div=document.createElement('div'); div.className='entry';
      const added=subscriptions.includes(a.id);
      div.innerHTML=`<div class="info"><b>${escapeHtml(a.name)}</b><div class="district">${escapeHtml(a.district)} ${escapeHtml(a.address || "")}</div></div>`;
      if(added){
        const stamp=document.createElement('div'); stamp.className='stamp'; stamp.textContent='등록완료';
        div.appendChild(stamp);
      } else {
        const btn=document.createElement('button'); btn.className='btn-add'; btn.textContent='알림 추가';
        btn.onclick=()=>addApartment(a,div,btn);
        div.appendChild(btn);
      }
      box.appendChild(div);
    });
  }catch(e){ status.textContent=e.message; }
}

async function addApartment(apt,row,btn){
  try{
    await api('/api/subscriptions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      apartmentId:apt.id, name:apt.name, district:apt.district, lawd_cd:apt.lawd_cd
    })});
    if(!apartments.some(a=>a.id===apt.id)) apartments.push(apt);
    subscriptions.push(apt.id); renderMine();
    const stamp=document.createElement('div'); stamp.className='stamp'; stamp.textContent='등록완료';
    row.replaceChild(stamp, btn);
  }catch(e){alert(e.message)}
}
async function removeApartment(id){
  if(!confirm('이 아파트 알림을 삭제할까요?')) return;
  try{ await api('/api/subscriptions',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({apartmentId:id})});
    subscriptions=subscriptions.filter(x=>x!==id); renderMine();
  }catch(e){alert(e.message)}
}
async function testNotify(){
  const btn=document.getElementById('testNotifyBtn');
  const status=document.getElementById('testNotifyStatus');
  btn.disabled=true;
  status.textContent='카카오톡을 보내는 중…';
  try{
    const data=await api('/api/test-notify');
    status.textContent=data.message || '카카오톡을 확인해보세요.';
  }catch(e){
    status.textContent=e.message;
  }finally{
    btn.disabled=false;
  }
}
async function logout(){ location.href='/api/logout'; }
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
init();
</script>
</body>
</html>

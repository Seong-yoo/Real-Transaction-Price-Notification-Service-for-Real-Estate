<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실거래 알리미</title>
  <style>
    *{box-sizing:border-box}

    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      max-width:960px;
      margin:0 auto;
      padding:28px 20px 64px;
      background:#f4f5f7;
      color:#191b1f;
      line-height:1.5
    }

    .card{
      background:#fff;
      border:1px solid #e8eaee;
      border-radius:24px;
      padding:28px;
      margin:16px 0;
      box-shadow:0 8px 30px rgba(25,30,40,.045)
    }

    /* ?? ??? */
    .hero{
      position:relative;
      overflow:hidden;
      padding:34px 34px 30px;
      color:#fff;
      border:0;
      background:linear-gradient(135deg,#252a33 0%,#171a20 100%);
      box-shadow:0 14px 40px rgba(20,25,35,.16)
    }

    .hero:after{
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      right:-55px;
      top:-75px;
      border-radius:50%;
      background:rgba(255,255,255,.055)
    }

    .hero h1{
      position:relative;
      z-index:1;
      margin:0 0 8px;
      font-size:31px;
      line-height:1.2;
      letter-spacing:-1.3px
    }

    .hero #status{
      position:relative;
      z-index:1;
      color:rgba(255,255,255,.68);
      font-size:14px
    }

    h2{
      margin:0;
      font-size:21px;
      letter-spacing:-.6px
    }

    .muted{
      color:#7d838d
    }

    /* ?? ?? */
    .section-card{
      padding:28px
    }

    .section-card > h2{
      margin-bottom:8px
    }

    /* ?? ?? */
    .search-section{
      padding:30px;
      box-shadow:0 12px 34px rgba(25,30,40,.065)
    }

    .search-section > p{
      margin:0 0 20px;
      font-size:14px;
      color:#858b94
    }

    .search-section .row{
      display:grid;
      grid-template-columns:150px minmax(0,1fr) 104px;
      gap:9px;
      align-items:stretch
    }

    input,select,button{
      font:inherit;
      min-height:52px;
      border-radius:14px
    }

    input,select{
      border:1px solid #dfe2e7;
      background:#fff;
      padding:13px 15px;
      color:#191b1f;
      outline:none;
      transition:border-color .15s ease,box-shadow .15s ease
    }

    input{
      width:100%;
      min-width:0
    }

    input::placeholder{
      color:#a1a6ae
    }

    input:focus,select:focus{
      border-color:#737b88;
      box-shadow:0 0 0 4px rgba(70,80,95,.07)
    }

    button{
      cursor:pointer;
      border:0;
      padding:12px 18px;
      background:#20242b;
      color:#fff;
      font-weight:700;
      transition:transform .12s ease,opacity .12s ease,background .12s ease
    }

    button:hover{
      opacity:.9
    }

    button:active{
      transform:scale(.98)
    }

    button:disabled{
      cursor:default;
      opacity:1
    }

    /* ?? ?? */
    .search-section .row button{
      background:#20242b;
      box-shadow:0 5px 14px rgba(20,25,30,.14)
    }

    /* ?? ?? */
    #results{
      margin-top:18px
    }

    #results:empty{
      margin-top:0
    }

    .search-section #results .apt{
      background:#fff;
      border:1px solid #e8eaee;
      border-radius:18px;
      margin:10px 0;
      padding:18px;
      min-height:82px;
      box-shadow:0 3px 12px rgba(20,25,35,.035)
    }

    .search-section #results .apt:hover{
      border-color:#d5d9df;
      box-shadow:0 7px 18px rgba(20,25,35,.07)
    }

    .apt{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      padding:16px 0;
      border-bottom:1px solid #edf0f2
    }

    .apt:last-child{
      border-bottom:0
    }

    .apt b{
      display:block;
      font-size:16px;
      letter-spacing:-.25px
    }

    .apt .muted{
      font-size:13px;
      margin-top:4px
    }

    /* ?? ?? ?? */
    #results .apt button{
      min-width:100px;
      flex-shrink:0;
      border-radius:12px;
      font-size:13px
    }

    #results .apt button.added{
      background:#eef7f1;
      color:#27734b;
      border:1px solid #d7ecdf
    }

    /* ?? ??? */
    .interest-section #mine .apt{
      background:#f8f9fb;
      border:1px solid #eceef1;
      border-radius:17px;
      margin:10px 0;
      padding:17px 18px
    }

    .interest-section #mine .apt:last-child{
      border-bottom:1px solid #eceef1
    }

    .interest-section #mine .apt:hover{
      background:#f6f7f9
    }

    .danger{
      background:#fff;
      color:#d65353;
      border:1px solid #f0d7d7;
      min-height:40px;
      padding:8px 14px;
      border-radius:11px;
      font-size:13px
    }

    .danger:hover{
      background:#fff7f7;
      opacity:1
    }

    #empty{
      padding:28px 10px 12px;
      text-align:center;
      font-size:14px
    }

    #searchStatus{
      margin-top:12px;
      font-size:13px
    }

    .hidden{
      display:none
    }

    /* ??? */
    #guest{
      text-align:center;
      padding:32px
    }

    #guest p{
      margin:0 0 20px;
      color:#646a74
    }

    #login{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      background:#fee500;
      color:#191919;
      padding:13px 22px;
      border-radius:13px;
      font-weight:750;
      box-shadow:0 5px 14px rgba(0,0,0,.08)
    }

    /* ???? */
    .logout-card{
      margin-top:8px;
      padding:4px 2px;
      text-align:right;
      background:transparent;
      border:0;
      box-shadow:none
    }

    button.secondary{
      background:#e9ebee;
      color:#555b64;
      min-height:42px;
      padding:9px 16px;
      font-size:13px
    }

    @media(max-width:700px){
      body{
        padding:16px 13px 42px
      }

      .card{
        border-radius:20px;
        padding:22px
      }

      .hero{
        padding:27px 24px 25px
      }

      .hero h1{
        font-size:27px
      }

      .section-card,
      .search-section{
        padding:23px
      }

      .search-section .row{
        grid-template-columns:1fr;
        gap:8px
      }

      input,select,button{
        width:100%
      }

      .apt{
        align-items:flex-start
      }

      .apt button{
        width:auto;
        min-width:88px;
        flex-shrink:0
      }

      #results .apt button{
        width:auto
      }
    }

    @media(max-width:420px){
      .apt{
        gap:10px
      }

      .apt b{
        font-size:15px
      }

      .apt .muted{
        font-size:12px
      }

      #results .apt button{
        min-width:88px;
        padding:10px 11px
      }
    }
</style>
</head>
<body>
  <div class="card">
    <h1>🏠 실거래 알리미</h1>
    <div id="status" class="muted">로그인 여부를 확인하고 있어요...</div>
  </div>

  <div id="guest" class="card hidden">
    <p>카카오로 로그인하면 내가 원하는 아파트만 골라서 실거래 알림을 받을 수 있어요.</p>
    <a id="login" href="/api/login">카카오로 로그인</a>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h2>내 관심 아파트</h2>
      <div id="mine"></div>
      <div id="empty" class="muted hidden">아직 등록한 아파트가 없어요.</div>
    </div>

    <div class="card">
      <h2>아파트 추가</h2>
      <p class="muted">서울 25개 구를 지원해요. 구를 고르고 아파트 이름을 검색하세요. (최근 6개월 내 실거래가 있는 단지만 검색돼요)</p>
      <div class="row">
        <select id="districtSelect"></select>
        <input id="search" placeholder="예: 헬리오시티, 잠실주공" onkeydown="if(event.key===String.fromCharCode(69,110,116,101,114)) searchApartments()">
        <button onclick="searchApartments()">검색</button>
      </div>
      <div id="results"></div>
      <div id="searchStatus" class="muted"></div>
    </div>


    <div class="card">
      <button class="secondary" onclick="logout()">로그아웃</button>
    </div>
  </div>

<script>
let me = null;
let subscriptions = [];
let apartments = [];
let lastResults = [];

// 백엔드 SEOUL_DISTRICTS(_lib.mjs)와 이름이 정확히 같아야 검색이 동작합니다.
const SEOUL_DISTRICTS = [
  "종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구",
  "노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구",
  "관악구","서초구","강남구","송파구","강동구"
];

async function api(url, options={}) {
  const r = await fetch(url, {credentials:'include', ...options});
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || '요청에 실패했습니다.');
  return data;
}

function fillDistrictSelect(){
  const sel=document.getElementById('districtSelect');
  sel.innerHTML = SEOUL_DISTRICTS.map(d=>`<option value="${d}">${d}</option>`).join('');
}

async function init(){
  fillDistrictSelect();
  try{
    const data = await api('/api/me');
    if(!data.loggedIn){
      document.getElementById('status').textContent='로그인하지 않았어요.';
      document.getElementById('guest').classList.remove('hidden');
      return;
    }
    me=data.user;
    document.getElementById('status').textContent=`${me.nickname || '사용자'}님으로 로그인됨`;
    document.getElementById('app').classList.remove('hidden');
    await loadAll();
  }catch(e){
    document.getElementById('status').textContent=e.message;
    document.getElementById('guest').classList.remove('hidden');
  }
}

async function loadAll(){
  const [a,s]=await Promise.all([api('/api/apartments'),api('/api/subscriptions')]);
  apartments=a.apartments; subscriptions=s.subscriptions;
  renderMine();
}

function renderMine(){
  const box=document.getElementById('mine');
  const empty=document.getElementById('empty');
  box.innerHTML='';
  const list=subscriptions.map(id=>apartments.find(a=>a.id===id)).filter(Boolean);
  empty.classList.toggle('hidden', list.length!==0);
  list.forEach(a=>{
    const div=document.createElement('div'); div.className='apt';
    div.innerHTML=`<div><b>${escapeHtml(a.name)}</b><div class="muted">${escapeHtml(a.district)}</div></div>`;
    const btn=document.createElement('button'); btn.className='danger'; btn.textContent='삭제';
    btn.onclick=()=>removeApartment(a.id); div.appendChild(btn); box.appendChild(div);
  });
}

async function searchApartments(){
  const district=document.getElementById('districtSelect').value;
  const q=document.getElementById('search').value.trim();
  const box=document.getElementById('results');
  const status=document.getElementById('searchStatus');
  if(!q){ box.innerHTML=''; status.textContent='아파트 이름을 입력해주세요.'; return; }
  status.textContent='검색 중...';
  box.innerHTML='';
  try{
    const data=await api(`/api/search-apartments?district=${encodeURIComponent(district)}&q=${encodeURIComponent(q)}`);
    lastResults=data.results||[];
    status.textContent = lastResults.length ? '' : '최근 6개월 내 거래 기록에서 일치하는 단지를 찾지 못했어요.';
    lastResults.forEach(a=>{
      const div=document.createElement('div'); div.className='apt';
      const added=subscriptions.includes(a.id);
      div.innerHTML=`<div><b>${escapeHtml(a.name)}</b><div class="muted">${escapeHtml(a.district)} ${escapeHtml(a.address || "")}</div></div>`;
      const btn=document.createElement('button'); btn.className=added?'added':''; btn.textContent=added?String.fromCharCode(46321,47197,50756,47308):String.fromCharCode(50508,47548,32,52628,44032); btn.disabled=added;
      if(!added) btn.onclick=()=>addApartment(a,btn);
      div.appendChild(btn); box.appendChild(div);
    });
  }catch(e){ status.textContent=e.message; }
}

async function addApartment(apt,btn){
  try{
    await api('/api/subscriptions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      apartmentId:apt.id, name:apt.name, district:apt.district, lawd_cd:apt.lawd_cd
    })});
    if(!apartments.some(a=>a.id===apt.id)) apartments.push(apt);
    subscriptions.push(apt.id); renderMine(); btn.textContent=String.fromCharCode(46321,47197,46108); btn.disabled=true; btn.classList.add('added');
  }catch(e){alert(e.message)}
}
async function removeApartment(id){
  if(!confirm('이 아파트 알림을 삭제할까요?')) return;
  try{ await api('/api/subscriptions',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({apartmentId:id})});
    subscriptions=subscriptions.filter(x=>x!==id); renderMine();
  }catch(e){alert(e.message)}
}
async function logout(){ location.href='/api/logout'; }
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
init();
</script>
</body>
</html>

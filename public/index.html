<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실거래 알리미</title>
  <style>
    *{box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      max-width:860px;
      margin:0 auto;
      padding:42px 20px 60px;
      background:#f5f6f8;
      color:#17181a;
      line-height:1.5
    }
    .card{
      background:#fff;
      border:1px solid #e8e9ec;
      border-radius:20px;
      padding:26px;
      margin:16px 0;
      box-shadow:0 8px 28px rgba(20,25,35,.055)
    }
    h1{margin:0 0 7px;font-size:30px;letter-spacing:-1px}
    h2{margin:0 0 18px;font-size:21px;letter-spacing:-.5px}
    .muted{color:#7a7f87}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    input,select,button{font:inherit;min-height:48px;border-radius:13px}
    input,select{
      border:1px solid #dfe1e5;
      background:#fff;
      padding:12px 14px;
      color:#17181a;
      outline:none
    }
    input{flex:1;min-width:220px}
    input:focus,select:focus{
      border-color:#8c93a0;
      box-shadow:0 0 0 3px rgba(80,90,110,.08)
    }
    button{
      cursor:pointer;
      border:0;
      padding:12px 18px;
      background:#17181a;
      color:#fff;
      font-weight:650;
      transition:transform .12s ease,opacity .12s ease,background .12s ease
    }
    button:hover{opacity:.9}
    button:active{transform:scale(.98)}
    button:disabled{cursor:default;opacity:1;background:#eef0f2;color:#858a92}
    button.added{background:#eef7f1;color:#26734a}
    button.secondary{background:#f0f1f3;color:#27292d}
    .apt{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      padding:16px 0;
      border-bottom:1px solid #edf0f2
    }
    .apt:last-child{border-bottom:0}
    .apt b{font-size:16px}
    .apt .muted{font-size:14px;margin-top:3px}
    .hidden{display:none}
    .danger{background:#f05252}
    #login{
      display:inline-block;
      text-decoration:none;
      background:#fee500;
      color:#191919;
      padding:13px 20px;
      border-radius:13px;
      font-weight:700
    }
    .notice{
      padding:14px 16px;
      border-radius:13px;
      background:#f3f6ff;
      border:1px solid #e1e7ff;
      margin-top:14px
    }
    #status{font-size:14px}
    #searchStatus{margin-top:12px}
    #results{margin-top:8px}
    @media(max-width:600px){
      body{padding:22px 14px 40px}
      .card{padding:20px;border-radius:17px}
      h1{font-size:26px}
      .row{flex-direction:column}
      input,select,button{width:100%}
      .apt{align-items:flex-start}
      .apt button{width:auto;min-width:92px;flex-shrink:0}
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏠 실거래 알리미</h1>
    <div id="status" class="muted">로그인 여부를 확인하고 있어요...</div>
  </div>

  <div id="guest" class="card hidden">
    <p>카카오로 로그인하면 내가 원하는 아파트만 골라서 실거래 알림을 받을 수 있어요.</p>
    <a id="login" href="/api/login">카카오로 로그인</a>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h2>내 관심 아파트</h2>
      <div id="mine"></div>
      <div id="empty" class="muted hidden">아직 등록한 아파트가 없어요.</div>
    </div>

    <div class="card">
      <h2>아파트 추가</h2>
      <p class="muted">서울 25개 구를 지원해요. 구를 고르고 아파트 이름을 검색하세요. (최근 6개월 내 실거래가 있는 단지만 검색돼요)</p>
      <div class="row">
        <select id="districtSelect"></select>
        <input id="search" placeholder="예: 헬리오시티, 잠실주공" onkeydown="if(event.key===String.fromCharCode(69,110,116,101,114)) searchApartments()">
        <button onclick="searchApartments()">검색</button>
      </div>
      <div id="results"></div>
      <div id="searchStatus" class="muted"></div>
    </div>


    <div class="card">
      <button class="secondary" onclick="logout()">로그아웃</button>
    </div>
  </div>

<script>
let me = null;
let subscriptions = [];
let apartments = [];
let lastResults = [];

// 백엔드 SEOUL_DISTRICTS(_lib.mjs)와 이름이 정확히 같아야 검색이 동작합니다.
const SEOUL_DISTRICTS = [
  "종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구",
  "노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구",
  "관악구","서초구","강남구","송파구","강동구"
];

async function api(url, options={}) {
  const r = await fetch(url, {credentials:'include', ...options});
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || '요청에 실패했습니다.');
  return data;
}

function fillDistrictSelect(){
  const sel=document.getElementById('districtSelect');
  sel.innerHTML = SEOUL_DISTRICTS.map(d=>`<option value="${d}">${d}</option>`).join('');
}

async function init(){
  fillDistrictSelect();
  try{
    const data = await api('/api/me');
    if(!data.loggedIn){
      document.getElementById('status').textContent='로그인하지 않았어요.';
      document.getElementById('guest').classList.remove('hidden');
      return;
    }
    me=data.user;
    document.getElementById('status').textContent=`${me.nickname || '사용자'}님으로 로그인됨`;
    document.getElementById('app').classList.remove('hidden');
    await loadAll();
  }catch(e){
    document.getElementById('status').textContent=e.message;
    document.getElementById('guest').classList.remove('hidden');
  }
}

async function loadAll(){
  const [a,s]=await Promise.all([api('/api/apartments'),api('/api/subscriptions')]);
  apartments=a.apartments; subscriptions=s.subscriptions;
  renderMine();
}

function renderMine(){
  const box=document.getElementById('mine');
  const empty=document.getElementById('empty');
  box.innerHTML='';
  const list=subscriptions.map(id=>apartments.find(a=>a.id===id)).filter(Boolean);
  empty.classList.toggle('hidden', list.length!==0);
  list.forEach(a=>{
    const div=document.createElement('div'); div.className='apt';
    div.innerHTML=`<div><b>${escapeHtml(a.name)}</b><div class="muted">${escapeHtml(a.district)}</div></div>`;
    const btn=document.createElement('button'); btn.className='danger'; btn.textContent='삭제';
    btn.onclick=()=>removeApartment(a.id); div.appendChild(btn); box.appendChild(div);
  });
}

async function searchApartments(){
  const district=document.getElementById('districtSelect').value;
  const q=document.getElementById('search').value.trim();
  const box=document.getElementById('results');
  const status=document.getElementById('searchStatus');
  if(!q){ box.innerHTML=''; status.textContent='아파트 이름을 입력해주세요.'; return; }
  status.textContent='검색 중...';
  box.innerHTML='';
  try{
    const data=await api(`/api/search-apartments?district=${encodeURIComponent(district)}&q=${encodeURIComponent(q)}`);
    lastResults=data.results||[];
    status.textContent = lastResults.length ? '' : '최근 6개월 내 거래 기록에서 일치하는 단지를 찾지 못했어요.';
    lastResults.forEach(a=>{
      const div=document.createElement('div'); div.className='apt';
      const added=subscriptions.includes(a.id);
      div.innerHTML=`<div><b>${escapeHtml(a.name)}</b><div class="muted">${escapeHtml(a.district)} ${escapeHtml(a.address || "")}</div></div>`;
      const btn=document.createElement('button'); btn.textContent=added?'등록됨':'알림 추가'; btn.disabled=added;
      if(!added) btn.onclick=()=>addApartment(a,btn);
      div.appendChild(btn); box.appendChild(div);
    });
  }catch(e){ status.textContent=e.message; }
}

async function addApartment(apt,btn){
  try{
    await api('/api/subscriptions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      apartmentId:apt.id, name:apt.name, district:apt.district, lawd_cd:apt.lawd_cd
    })});
    if(!apartments.some(a=>a.id===apt.id)) apartments.push(apt);
    subscriptions.push(apt.id); renderMine(); btn.textContent=String.fromCharCode(46321,47197,46108); btn.disabled=true; btn.classList.add('added');
  }catch(e){alert(e.message)}
}
async function removeApartment(id){
  if(!confirm('이 아파트 알림을 삭제할까요?')) return;
  try{ await api('/api/subscriptions',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({apartmentId:id})});
    subscriptions=subscriptions.filter(x=>x!==id); renderMine();
  }catch(e){alert(e.message)}
}
async function logout(){ location.href='/api/logout'; }
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
init();
</script>
</body>
</html>
